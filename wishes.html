<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎂 粉絲祝福牆 - 2026 Happy Yuan Day</title>

    <!-- SEO Tags -->
    <meta name="description" content="所有粉絲對媛媛的生日祝福" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="styles/variables.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        overflow-x: hidden;
      }

      body {
        min-height: 100vh;
        height: auto !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        display: block !important;
        padding: 20px;
        padding-bottom: 40px;
        max-width: 100vw;
        background-color: #a8d8ea;
        background-image: linear-gradient(
            rgba(168, 216, 234, 0.8),
            rgba(168, 216, 234, 0.8)
          ),
          url("./images/yuan-birthday-art.png");
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      .wishes-container {
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        padding: 0 10px;
        box-sizing: border-box;
      }

      .wishes-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .wishes-header h1 {
        font-size: 2rem;
        margin-bottom: 10px;
        color: #ffffff;
        font-weight: 700;
        text-shadow: 3px 3px 0 #4a90c2, -1px -1px 0 #4a90c2, 1px -1px 0 #4a90c2,
          -1px 1px 0 #4a90c2, 1px 1px 0 #4a90c2,
          0 0 20px rgba(74, 144, 194, 0.5);
      }

      .wishes-header p {
        color: #4a90c2;
        font-size: 1rem;
        font-weight: 600;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
      }

      .wishes-count {
        text-align: center;
        margin-bottom: 20px;
        color: #5b9bd5;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .wishes-grid {
        column-count: 2;
        column-gap: 16px;
      }

      .wish-card {
        background: rgba(255, 255, 255, 0.85);
        border-radius: 12px;
        padding: 20px;
        border: 2px solid rgba(91, 155, 213, 0.4);
        backdrop-filter: blur(10px);
        transition: transform 0.2s, box-shadow 0.2s;
        break-inside: avoid;
        margin-bottom: 16px;
        width: 100%;
        max-width: 100%;
        box-shadow: 0 4px 15px rgba(91, 155, 213, 0.2);
      }

      .wish-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 30px rgba(91, 155, 213, 0.35);
        border-color: rgba(91, 155, 213, 0.6);
      }

      .wish-nickname {
        font-weight: 700;
        color: #4a90c2;
        font-size: 1rem;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .wish-nickname::before {
        content: "💙";
      }

      .wish-message {
        color: #3a3a5a;
        font-size: 0.95rem;
        line-height: 1.6;
        word-break: break-word;
      }


      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #5b9bd5;
      }

      .empty-state .icon {
        font-size: 3rem;
        margin-bottom: 16px;
      }

      .back-link {
        display: inline-block;
        margin-top: 30px;
        padding: 12px 24px;
        background: rgba(255, 255, 255, 0.9);
        border: 2px solid #5b9bd5;
        color: #4a90c2;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.2s;
        backdrop-filter: blur(5px);
      }

      .back-link:hover {
        background: #5b9bd5;
        color: white;
        transform: scale(1.05);
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #5b9bd5;
      }

      @media (max-width: 768px) {
        body {
          padding: 16px;
          padding-bottom: 30px;
          background-image: linear-gradient(
              rgba(168, 216, 234, 0.85),
              rgba(168, 216, 234, 0.85)
            ),
            url("./images/yuan-birthday-art.png");
          background-position: center 20%;
          background-attachment: scroll;
        }

        .wishes-container {
          padding: 0 5px;
        }

        .wishes-header {
          margin-bottom: 20px;
        }

        .wishes-header h1 {
          font-size: 1.5rem;
        }

        .wishes-header p {
          font-size: 0.9rem;
        }

        .wishes-count {
          margin-bottom: 16px;
          font-size: 0.85rem;
        }

        .wishes-grid {
          column-count: 1;
        }

        .wish-card {
          padding: 16px;
          border-radius: 10px;
        }

        .back-link {
          margin-top: 20px;
          padding: 10px 20px;
          font-size: 0.9rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="wishes-container">
      <div class="wishes-header">
        <h1>🎂 粉絲祝福牆</h1>
        <p>來自所有粉絲的生日祝福</p>
      </div>

      <div id="wishes-grid" class="wishes-grid">
        <div class="loading">載入中...</div>
      </div>

      <div style="text-align: center">
        <a href="https://2026happyyuanday.com/" class="back-link">← 返回遊戲</a>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
      // Firebase 設定
      const firebaseConfig = {
        apiKey: "AIzaSyA5vu1AzlUPRbszYzjM0WTxpxZmJhbUR74",
        authDomain: "yuan-birthday-gam.firebaseapp.com",
        projectId: "yuan-birthday-gam",
        storageBucket: "yuan-birthday-gam.firebasestorage.app",
        messagingSenderId: "891333323583",
        appId: "1:891333323583:web:2bdf6e420db3ba9f5b018a",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();


      // 載入祝福
      async function loadWishes() {
        const grid = document.getElementById("wishes-grid");

        try {
          const snapshot = await db
            .collection("wishes")
            .orderBy("createdAt", "desc")
            .get();

          if (snapshot.empty) {
            grid.innerHTML = `
              <div class="empty-state" style="grid-column: 1 / -1;">
                <div class="icon">💌</div>
                <p>還沒有祝福，成為第一個送上祝福的人吧！</p>
              </div>
            `;
            return;
          }

          let html = "";
          snapshot.forEach((doc) => {
            const wish = doc.data();
            html += `
              <div class="wish-card">
                <div class="wish-nickname">${escapeHtml(wish.nickname)}</div>
                <div class="wish-message">${escapeHtml(wish.message)}</div>
              </div>
            `;
          });

          grid.innerHTML = html;
        } catch (error) {
          console.error("載入祝福失敗:", error);
          grid.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <div class="icon">😢</div>
              <p>載入失敗，請稍後再試</p>
            </div>
          `;
        }
      }

      // 防止 XSS
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // 初始載入
      loadWishes();
    </script>
  </body>
</html>
